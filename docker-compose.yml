services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wc_2026_portal
    ports:
      - "5432:5432"
    volumes:
      - wc_2026_portal_postgres:/var/lib/postgresql/data

volumes:
  wc_2026_portal_postgres:
